name: Build APK Native (Sans Expo)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g., 1.7.2)'
        required: true
        default: '1.7.2'
  push:
    tags:
      - 'v1.7.*'
      - 'v2.*'
      - 'v3.*'
      - 'v4.*'
      - 'v5.*'
      - '7.*'
      - 'native-build-*'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-android-native:
    name: 🚀 Build Android APK (Native)
    runs-on: ubuntu-latest

    permissions:
      contents: write
      packages: write
      actions: read
      checks: write
      deployments: write
      issues: write
      pull-requests: write
      repository-projects: write
      statuses: write

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🏷️ Get version info
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "📱 Building version: $VERSION"

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: ☕ Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🤖 Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 🛠️ Install Android NDK (requis par llama.rn)
        run: |
          echo "🛠️ Installing NDK 26.1.10909125 (requis pour llama.cpp/llama.rn)..."
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;26.1.10909125" --sdk_root=$ANDROID_HOME
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV
          echo "NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV
          echo "✅ NDK installé: $ANDROID_HOME/ndk/26.1.10909125"

      - name: 📦 Install dependencies
        run: |
          echo "📦 Installing dependencies..."
          npm ci

      - name: 🔑 Setup Expo CLI
        run: |
          echo "🔑 Installing Expo CLI..."
          npm install -g expo-cli

      - name: 🏗️ Prebuild Android native files
        run: |
          echo "🏗️ Generating Android native files..."
          npx expo prebuild --platform android --clean

          echo "✅ Android files generated"
          ls -la android/

          echo "🔍 Vérification network_security_config..."
          if [ -f "android/app/src/main/res/xml/network_security_config.xml" ]; then
            echo "✅ network_security_config.xml créé par le plugin"
            cat android/app/src/main/res/xml/network_security_config.xml | head -10
          else
            echo "⚠️ network_security_config.xml PAS créé"
            ls -la android/app/src/main/res/xml/ || echo "⚠️ xml directory missing"
          fi

          echo "🔍 Vérification llama.rn CMakeLists..."
          if find android -name "CMakeLists.txt" | grep -q llama; then
            echo "✅ CMakeLists.txt llama.rn trouvé"
          else
            echo "⚠️ Aucun CMakeLists llama trouvé — vérifiez le lien du module"
          fi

      - name: 🔧 Configure Gradle
        run: |
          echo "🔧 Configuring Gradle..."
          cd android

          if [ ! -f "local.properties" ]; then
            echo "sdk.dir=$ANDROID_HOME" > local.properties
            echo "ndk.dir=$ANDROID_NDK_HOME" >> local.properties
            echo "✅ Created local.properties with NDK path"
          else
            echo "ndk.dir=$ANDROID_NDK_HOME" >> local.properties
            echo "✅ Added NDK path to existing local.properties"
          fi

          if [ -f "gradlew" ]; then
            chmod +x gradlew
          echo "android.experimental.forceLegacyModeForVariantAPI=true" >> gradle.properties
          echo "✅ AGP legacy mode fix ajouté"
            echo "✅ Gradle wrapper ready"
          else
            echo "❌ No gradle wrapper found"
            exit 1
          fi

      - name: 🔨 Build APK with Gradle
        run: |
          echo "🔨 Building APK..."
          cd android
          ./gradlew assembleRelease --no-daemon --stacktrace
          echo "✅ APK built successfully"
          find app/build/outputs/apk/release/ -name "*.apk" -type f

      - name: 📝 Rename APK
        run: |
          echo "📝 Renaming APK..."
          VERSION="${{ steps.version.outputs.version }}"
          APK_PATH=$(find android/app/build/outputs/apk/release/ -name "*.apk" -type f | head -1)
          if [ -n "$APK_PATH" ]; then
            cp "$APK_PATH" "roleplay-chat-v${VERSION}-native.apk"
            APK_SIZE=$(du -h "roleplay-chat-v${VERSION}-native.apk" | cut -f1)
            echo "✅ APK renamed: roleplay-chat-v${VERSION}-native.apk ($APK_SIZE)"
            ls -lh "roleplay-chat-v${VERSION}-native.apk"
          else
            echo "❌ No APK found"
            exit 1
          fi

      - name: 📤 Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: roleplay-chat-v${{ steps.version.outputs.version }}-native-apk
          path: roleplay-chat-v${{ steps.version.outputs.version }}-native.apk
          retention-days: 90

      - name: 🏷️ Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: roleplay-chat-v${{ steps.version.outputs.version }}-native.apk
          body: |
            # 🚀 Roleplay Chat v${{ steps.version.outputs.version }} (Native Build)

            **Build Method**: Native Android (Gradle)
            **No Expo Account Required**: ✅
            **Completely Free**: ✅

            ## 📥 Installation
            1. Téléchargez `roleplay-chat-v${{ steps.version.outputs.version }}-native.apk`
            2. Transférez sur votre téléphone Android
            3. Activez "Sources inconnues" si nécessaire
            4. Installez l'APK
            5. Configurez vos clés API Groq dans les paramètres

            ---
            **Date**: ${{ github.event.head_commit.timestamp }}
            **Commit**: ${{ github.sha }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 📊 Build Summary
        if: always()
        run: |
          echo "## 📱 Native Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **App**: Roleplay Chat" >> $GITHUB_STEP_SUMMARY
          echo "- **Version**: ${{ steps.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Platform**: Android" >> $GITHUB_STEP_SUMMARY
          echo "- **Build Method**: Native Gradle (No Expo Account)" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          if [ "${{ job.status }}" = "success" ]; then
            echo "### ✅ Build réussi!" >> $GITHUB_STEP_SUMMARY
          else
            echo "### ❌ Build échoué — consultez les logs ci-dessus." >> $GITHUB_STEP_SUMMARY
          fi
