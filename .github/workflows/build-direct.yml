name: Build APK Direct (No EAS)

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build APK avec Gradle Direct
    runs-on: ubuntu-latest

    steps:
      - name: 🔍 Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: ☕ Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🤖 Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 🛠️ Install Android NDK 26 (requis par Expo 51 / RN 0.74)
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;26.1.10909125" --sdk_root=$ANDROID_HOME
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV
          echo "NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV
          echo "✅ NDK 26.1.10909125 installé"

      - name: 🗑️ Clean everything
        run: |
          rm -rf node_modules android ios .expo
          npm cache clean --force

      - name: 📦 Install dependencies
        run: npm install

      - name: 🔧 Setup Expo
        run: npm install -g expo-cli

      - name: 🏗️ Prebuild (Generate native Android files)
        run: npx expo prebuild --platform android --clean

      - name: 🔧 Configure Gradle with NDK + AGP compatibility
        run: |
          cd android
          # NDK path
          if [ ! -f "local.properties" ]; then
            echo "sdk.dir=$ANDROID_HOME" > local.properties
          fi
          echo "ndk.dir=$ANDROID_NDK_HOME" >> local.properties
          # Fix: expo-modules-core 'release' SoftwareComponent issue with AGP 8.x
          echo "android.experimental.forceLegacyModeForVariantAPI=true" >> gradle.properties
          # llama.rn 0.12+ requires React Native New Architecture (TurboModules + Codegen)
          echo "newArchEnabled=true" >> gradle.properties
          echo "hermesEnabled=true" >> gradle.properties
          chmod +x gradlew
          echo "✅ Gradle + NDK + AGP fix + New Arch configurés"
          cat local.properties
          echo "--- gradle.properties (tail) ---"
          tail -10 gradle.properties

      - name: 📝 Create keystore
        run: |
          cd android/app
          keytool -genkeypair -v -storetype PKCS12 \
            -keystore release.keystore \
            -alias roleplaychat \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=RoleplayChat, OU=Dev, O=RoleplayChat, L=Paris, S=IDF, C=FR"

      - name: 🏗️ Build APK with Gradle
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: 🔍 Find and rename APK
        run: |
          APK_PATH=$(find android/app/build/outputs/apk/release -name "*.apk" | head -1)
          echo "Found APK at: $APK_PATH"
          cp "$APK_PATH" cde.apk
          ls -lh cde.apk

      - name: 📊 Get APK info
        id: apk_info
        run: |
          APK_SIZE=$(ls -lh cde.apk | awk '{print $5}')
          echo "apk_size=$APK_SIZE" >> $GITHUB_OUTPUT
          echo "APK Size: $APK_SIZE"

      - name: 📤 Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: cde-apk
          path: cde.apk
          retention-days: 30

      - name: 🏷️ Upload to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: cde.apk
          fail_on_unmatched_files: false
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: ✅ Build Summary
        run: |
          echo "### 🎉 Build Direct Successful!" >> $GITHUB_STEP_SUMMARY
          echo "- **APK Size**: ${{ steps.apk_info.outputs.apk_size }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Method**: Direct Gradle (No EAS Cache)" >> $GITHUB_STEP_SUMMARY
